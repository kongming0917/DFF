name: dvs_project
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python 버전 (3.11 권장 - 성능 개선)
  - python=3.11

  # PyTorch (CUDA 지원)
  - pytorch>=2.0.0
  - torchvision>=0.15.0  
  - torchaudio>=2.0.0
  - pytorch-cuda=11.8

  # 과학 계산
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0

  # 시각화
  - matplotlib>=3.5.0
  - seaborn>=0.11.0

  # 개발 도구
  - jupyter
  - tqdm
  
  # pip으로 설치할 패키지들
  - pip
  - pip:
    - scikit-learn>=1.0.0
    - filterpy>=1.4.5  # Kalman filter for KalmanPointExtractor
